name: CI

# Fast, device-free checks on every push and PR: the Python test suite (ola.py
# protobuf/address helpers) and the apks/manifest.json integrity checks.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        # grpcio lets test_ola.py and test_grpc.py run the real gRPC transport against
        # the fake wifican daemon; without it those skip and the rest still run.
        run: python -m pip install --upgrade pytest grpcio
      - name: Run tests
        # test_ola = wire-protocol helpers; test_manifest = APK source-of-truth integrity;
        # test_flow = grant-contract correctness; test_setup_integration = the install/
        # uninstall flow over a fake adb; test_grpc = ola.py over a fake wifican daemon.
        run: pytest -q test_ola.py test_manifest.py test_flow.py test_setup_integration.py test_grpc.py
