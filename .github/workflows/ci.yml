name: CI

# Fast, device-free checks on every push and PR: the Python test suite (ola.py
# protobuf/address helpers) and the apks/manifest.json integrity checks.
on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run tests
        # test_ola.py = wire-protocol helpers; test_manifest.py = APK source-of-truth integrity.
        run: pytest -q test_ola.py test_manifest.py
