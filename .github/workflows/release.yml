name: Release

# Tag build: compile the S1Mods app and all four mods FROM SOURCE, sign each
# from CI secrets, write SHA256SUMS, attach everything to a GitHub Release, and
# attest build provenance. Triggered by a semver tag (e.g. v1.3.0).
#
# Each fork pins its own Gradle wrapper + toolchain (see docs/BUILD.md), so the
# matrix below carries per-fork JDK / NDK / task / flavor and signing wiring.
#
# Signing secrets (repository → Settings → Secrets and variables → Actions):
#   App (android/, reads S1MODS_* env):
#     S1MODS_KEYSTORE_BASE64, S1MODS_KEYSTORE_PASSWORD, S1MODS_KEY_ALIAS, S1MODS_KEY_PASSWORD
#   balls / music (each reads keystore.properties beside the project):
#     BALLS_KEYSTORE_BASE64 / BALLS_KEYSTORE_PASSWORD / BALLS_KEY_ALIAS / BALLS_KEY_PASSWORD
#     MUSIC_KEYSTORE_BASE64 / MUSIC_KEYSTORE_PASSWORD / MUSIC_KEY_ALIAS / MUSIC_KEY_PASSWORD
#   openplay (reads ANDROID_KEYSTORE_* env):
#     OPENPLAY_KEYSTORE_BASE64 / OPENPLAY_KEYSTORE_PASSWORD / OPENPLAY_KEY_ALIAS / OPENPLAY_KEY_PASSWORD
#   androidauto (reads key.properties):
#     ANDROIDAUTO_KEYSTORE_BASE64 / ANDROIDAUTO_KEYSTORE_PASSWORD / ANDROIDAUTO_KEY_ALIAS / ANDROIDAUTO_KEY_PASSWORD
# Each *_KEYSTORE_BASE64 is `base64 -w0 your-release-key.jks`.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # create the Release
  id-token: write        # provenance attestation
  attestations: write    # provenance attestation

jobs:
  app:
    name: Build S1Mods app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # mods read git describe; full history keeps versions honest
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Decode app keystore
        if: ${{ secrets.S1MODS_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.S1MODS_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/s1mods.jks"
      - name: Build signed release
        working-directory: android
        env:
          S1MODS_KEYSTORE_FILE: ${{ runner.temp }}/s1mods.jks
          S1MODS_KEYSTORE_PASSWORD: ${{ secrets.S1MODS_KEYSTORE_PASSWORD }}
          S1MODS_KEY_ALIAS: ${{ secrets.S1MODS_KEY_ALIAS }}
          S1MODS_KEY_PASSWORD: ${{ secrets.S1MODS_KEY_PASSWORD }}
        run: ./gradlew --no-daemon assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: apk-app
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  mods:
    name: Build ${{ matrix.id }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: balls
            dir: mods/balls
            java: "25"
            ndk: ""
            rust: false
            task: ":app:assembleFossRelease"
            sign: keystore_properties
            secret_prefix: BALLS
          - id: openplay
            dir: mods/openplay
            java: "25"
            ndk: ""        # :shared uses ndkBuild with the SDK's default NDK
            rust: false
            task: ":mobile:assembleRelease"
            sign: env_android_keystore
            secret_prefix: OPENPLAY
          - id: music
            dir: mods/music
            java: "25"
            ndk: "28.2.13676358"
            rust: true
            task: ":app:assembleRelease"
            sign: keystore_properties
            secret_prefix: MUSIC
          - id: androidauto
            dir: mods/androidauto
            java: "21"     # open-headunit's Gradle 8.14 rejects JDK 25
            ndk: "29.0.14206865"
            rust: false
            task: ":app:assembleGithubRelease"
            sign: key_properties
            secret_prefix: ANDROIDAUTO
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: android-actions/setup-android@v3
      - name: Install pinned NDK
        if: ${{ matrix.ndk != '' }}
        run: sdkmanager "ndk;${{ matrix.ndk }}" "cmake;3.22.1"
      - name: Rust toolchain for the native core
        if: ${{ matrix.rust }}
        run: |
          rustup target add aarch64-linux-android armv7-linux-androideabi
          cargo install cargo-ndk --locked
      - name: Decode keystore
        run: echo "${{ secrets[format('{0}_KEYSTORE_BASE64', matrix.secret_prefix)] }}" | base64 -d > "$RUNNER_TEMP/release.jks"
      - name: Wire signing (keystore.properties)
        if: ${{ matrix.sign == 'keystore_properties' }}
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.secret_prefix)] }}"
            echo "keyAlias=${{ secrets[format('{0}_KEY_ALIAS', matrix.secret_prefix)] }}"
            echo "keyPassword=${{ secrets[format('{0}_KEY_PASSWORD', matrix.secret_prefix)] }}"
          } > "${{ matrix.dir }}/keystore.properties"
      - name: Wire signing (key.properties)
        if: ${{ matrix.sign == 'key_properties' }}
        run: |
          {
            echo "storeFile=$RUNNER_TEMP/release.jks"
            echo "storePassword=${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.secret_prefix)] }}"
            echo "keyAlias=${{ secrets[format('{0}_KEY_ALIAS', matrix.secret_prefix)] }}"
            echo "keyPassword=${{ secrets[format('{0}_KEY_PASSWORD', matrix.secret_prefix)] }}"
          } > "${{ matrix.dir }}/key.properties"
      - name: Build signed release
        working-directory: ${{ matrix.dir }}
        env:
          # openplay reads these four; harmless for the others.
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets[format('{0}_KEYSTORE_PASSWORD', matrix.secret_prefix)] }}
          ANDROID_KEY_ALIAS: ${{ secrets[format('{0}_KEY_ALIAS', matrix.secret_prefix)] }}
          ANDROID_KEY_PASSWORD: ${{ secrets[format('{0}_KEY_PASSWORD', matrix.secret_prefix)] }}
        run: ./gradlew --no-daemon ${{ matrix.task }}
      - name: Collect APKs
        run: |
          mkdir -p out
          find "${{ matrix.dir }}" -path '*/build/outputs/apk/*release*/*.apk' -exec cp {} out/ \;
      - uses: actions/upload-artifact@v4
        with:
          name: apk-${{ matrix.id }}
          path: out/*.apk
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [app, mods]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum *.apk | tee SHA256SUMS
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v1
        with:
          subject-path: dist/*.apk
      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/SHA256SUMS
          generate_release_notes: true
